# selene standard library additions, layered on the Roblox one.
#
# Empty since PLAN-M5 phase 6. It used to declare every `types.*` member and every helper type
# function the bodies call each other with — thirty lines a rename had to be kept in step with —
# on the belief that selene's lint filters were file-global. They are not: `-- selene:
# allow(undefined_variable)` on the line before a `type function` covers that function's body and
# nothing else (M4-1, measured; re-measured at 0.29.0 while removing this list), so each of the
# thirty type functions carries its own allow and an undefined global anywhere else in the same
# file is still caught. The file stays so that `std = "roblox+netweave"` in selene.toml keeps a
# place to put a real addition, and so that the reason the list is gone is beside where it was.
[selene]
base = "roblox"
name = "netweave"
